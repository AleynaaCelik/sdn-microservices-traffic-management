version: "3.9"

services:
  # ---------- VERİTABANLARI ----------
  mongo-product:
    image: mongo:7
    container_name: mongo-product
    ports:
      - "27018:27017"
    volumes:
      - mongo-product-data:/data/db
    networks:
      - eticaret-net

  mongo-auth:
    image: mongo:7
    container_name: mongo-auth
    ports:
      - "27019:27017"
    volumes:
      - mongo-auth-data:/data/db
    networks:
      - eticaret-net

  mongo-order:
    image: mongo:7
    container_name: mongo-order
    ports:
      - "27020:27017"
    volumes:
      - mongo-order-data:/data/db
    networks:
      - eticaret-net

  redis-cart:
    image: redis:7-alpine
    container_name: redis-cart
    ports:
      - "6379:6379"
    networks:
      - eticaret-net

  # ---------- MİKROSERVİSLER ----------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://mongo-auth:27017/authdb
      - JWT_SECRET=super-gizli-anahtar-degistir
    depends_on:
      - mongo-auth
    ports:
      - "4001:4001"
    networks:
      - eticaret-net

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      - PORT=4002
      - MONGO_URI=mongodb://mongo-product:27017/productdb
    depends_on:
      - mongo-product
    ports:
      - "4002:4002"
    networks:
      - eticaret-net

  cart-service:
    build: ./cart-service
    container_name: cart-service
    environment:
      - PORT=4003
      - REDIS_URL=redis://redis-cart:6379
      - PRODUCT_SERVICE_URL=http://product-service:4002
    depends_on:
      - redis-cart
      - product-service
    ports:
      - "4003:4003"
    networks:
      - eticaret-net

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      - PORT=4004
      - MONGO_URI=mongodb://mongo-order:27017/orderdb
      - CART_SERVICE_URL=http://cart-service:4003
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - PAYMENT_SERVICE_URL=http://payment-service:4005
    depends_on:
      - mongo-order
      - cart-service
      - product-service
      - payment-service
    ports:
      - "4004:4004"
    networks:
      - eticaret-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      - PORT=4005
    ports:
      - "4005:4005"
    networks:
      - eticaret-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - CART_SERVICE_URL=http://cart-service:4003
      - ORDER_SERVICE_URL=http://order-service:4004
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
    ports:
      - "3000:3000"
    networks:
      - eticaret-net

networks:
  eticaret-net:
    driver: bridge

volumes:
  mongo-product-data:
  mongo-auth-data:
  mongo-order-data: